[project]
name = "chessbuddy"
version = "0.1.0"
description = "Fetch live chess.com FEN via WebBridge, render & edit the board, analyze with local Stockfish"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.11.0",
    "python-chess>=1.999",
]

[project.scripts]
chessbuddy = "chessbuddy.main:main"

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"
